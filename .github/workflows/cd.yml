name: CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-hit: ${{ steps.pnpm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Cache pnpm store
        uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
  linter:
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Restore dependencies
        if: needs.setup.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 10
      - run: pnpm run build
        timeout-minutes: 10
      - run: pnpm run lint
        timeout-minutes: 10
      - run: pnpm run check

  tests:
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Restore dependencies
        if: needs.setup.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 10
      # No browser cache: the payload takes a second on these runners, and a
      # half-restored ~/.cache/ms-playwright is one more thing that can stall
      # the installer without printing anything.
      - name: Install browser dependencies
        run: pnpm --filter __tests__ exec playwright install-deps chromium
        timeout-minutes: 8

      - name: Install Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          df -h / | tail -1
          for attempt in 1 2 3; do
            echo "install attempt $attempt"
            if timeout 300 pnpm --filter __tests__ exec playwright install chromium; then
              ls ~/.cache/ms-playwright
              exit 0
            fi
            echo "attempt $attempt did not finish; clearing the cache and retrying"
            rm -rf ~/.cache/ms-playwright
            sleep 5
          done
          exit 1
        timeout-minutes: 20
      - run: pnpm run build
        timeout-minutes: 10
      - run: pnpm run test
        timeout-minutes: 20
  release:
    needs: [setup, linter, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Restore dependencies
        if: needs.setup.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm semantic-release
        env:
          GH_TOKEN: ${{ secrets.IMGCAP_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.IMGCAP_NPM_TOKEN }}
